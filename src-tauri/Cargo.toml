[package]
name = "geoventure-launcher"
version = "2.0.0-rust.1"
description = "Launcher moderne Geoventure en Rust + Tauri v2"
authors = ["Geoventure Team"]
edition = "2021"
rust-version = "1.78"

[lib]
name = "geoventure_launcher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "devtools", "compression", "dynamic-acl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
url = "2"
directories = "6"
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
regex = "1"
roxmltree = "0.20"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = true
